name: Reusable - build & upload wheel to Azure Blob

on:
  workflow_call:
    inputs:
      package_dir:
        description: "Relative path to the Python package directory (contains setup.py / pyproject.toml)"
        required: true
        type: string
      package_name:
        description: "Used as folder name in Blob Storage"
        required: true
        type: string
      python_version:
        description: "Python version used to build"
        required: false
        default: "3.11"
        type: string
      blob_prefix:
        description: "Optional prefix in the container (e.g. 'wheels')"
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        working-directory: ${{ inputs.package_dir }}
        run: |
          python -m build --wheel
          ls -lah dist

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload wheel(s) to Azure Blob Storage
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_DIR: ${{ inputs.package_dir }}
          BLOB_PREFIX: ${{ inputs.blob_prefix }}
        run: |
          set -euo pipefail

          DIST_DIR="${PACKAGE_DIR}/dist"

          # Normalize optional prefix: "" or "prefix"
          PREFIX=""
          if [ -n "${BLOB_PREFIX}" ]; then
            PREFIX="${BLOB_PREFIX%/}/"
          fi

          # Store as: <prefix><package_name>/<wheel_file>
          for f in "${DIST_DIR}"/*.whl; do
            echo "Uploading ${f} ..."
            az storage blob upload \
              --account-name "${AZURE_STORAGE_ACCOUNT}" \
              --container-name "${AZURE_STORAGE_CONTAINER}" \
              --name "${PREFIX}${PACKAGE_NAME}/$(basename "${f}")" \
              --file "${f}" \
              --overwrite true \
              --auth-mode login
          done

      - name: Print blob URL(s)
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          BLOB_PREFIX: ${{ inputs.blob_prefix }}
        run: |
          PREFIX=""
          if [ -n "${BLOB_PREFIX}" ]; then
            PREFIX="${BLOB_PREFIX%/}/"
          fi

          echo "Uploaded to:"
          for f in "${{ inputs.package_dir }}/dist"/*.whl; do
            echo "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${PREFIX}${PACKAGE_NAME}/$(basename "${f}")"
          done
